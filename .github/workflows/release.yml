name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build .app bundle
        run: pyinstaller ClipMark.spec

      - name: Create archive
        run: |
          cd dist
          zip -r ClipMark-macOS-${{ github.ref_name }}.zip ClipMark.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipMark ${{ github.ref_name }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: false
          files: dist/ClipMark-macOS-${{ github.ref_name }}.zip