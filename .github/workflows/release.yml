name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_arch: arm64
          - os: macos-latest
            os_arch: x86_64
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python 3.12 (${{ matrix.os_arch }})
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.os_arch }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-xv0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build package
        run: pyinstaller ClipMark.spec

      - name: Create archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ClipMark-macOS-${{ matrix.os_arch }}-${{ github.ref_name }}.zip ClipMark.app

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ClipMark -DestinationPath dist\ClipMark-Windows-${{ github.ref_name }}.zip

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf ClipMark-Linux-${{ github.ref_name }}.tar.gz ClipMark

      - name: Determine artifact path
        id: artifact
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)  echo "path=dist/ClipMark-macOS-${{ matrix.os_arch }}-${{ github.ref_name }}.zip" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "path=dist/ClipMark-Windows-${{ github.ref_name }}.zip" >> "$GITHUB_OUTPUT" ;;
            Linux)  echo "path=dist/ClipMark-Linux-${{ github.ref_name }}.tar.gz" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipMark ${{ github.ref_name }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: false
          files: ${{ steps.artifact.outputs.path }}
